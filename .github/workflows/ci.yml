name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-build:
    name: Test and Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: agent-init/go.mod

      - name: Run Unit Tests and Race Detector
        working-directory: agent-init
        run: go test -v -race ./...

      - name: Verify Cross-Platform Compilation
        working-directory: agent-init
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build -o ../dist/agent-init-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o ../dist/agent-init-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o ../dist/agent-init-windows-amd64.exe .

      - name: Validate Workflow Scripts
        run: |
          bash -n scripts/sync-issues.sh
          test -x scripts/sync-issues.sh
