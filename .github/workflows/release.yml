name: Release agent-init CLI

on:
  push:
    tags:
      - 'agent-init/v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: agent-init/go.mod

      - name: Run Tests
        working-directory: agent-init
        run: go test -v -race ./...

      - name: Compile Release Binaries
        working-directory: agent-init
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#agent-init/}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE} -s -w"

          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ../dist/agent-init-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o ../dist/agent-init-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o ../dist/agent-init-windows-amd64.exe .

          cd ../dist
          sha256sum agent-init-linux-amd64 agent-init-linux-arm64 agent-init-windows-amd64.exe > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: agent-init ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/agent-init-linux-amd64
            dist/agent-init-linux-arm64
            dist/agent-init-windows-amd64.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
